# Example 1: Single Network with Multiple DVNs
networks:
  - name: "ethereum"
    chain_id: 1
    rpc: "https://eth.llamarpc.com"
    endpoint: "0x1a44076050125825900e736c501f859c50fE728c"
    trusted_send_lib: "0x9d7e4c5321c4c7e8b4e8b4e8b4e8b4e8b4e8b4e8b"
    trusted_receive_lib: "0x9d7e4c5321c4c7e8b4e8b4e8b4e8b4e8b4e8b4e8b"
    private_key: "0x1234567890abcdef1234567890abcdef1234567890abcdef1234567890abcdef"
    eid: 30101
    dvnAddresses:
      - "0x589dedbd617e0cbcb916a9223f4d1300c294236b"  # LayerZero DVN
      - "0x1234567890abcdef1234567890abcdef12345678"  # Google DVN
      - "0xabcdef1234567890abcdef1234567890abcdef12"  # Nethermind DVN
  - name: "polygon"
    chain_id: 137
    rpc: "https://polygon.llamarpc.com"
    endpoint: "0x1a44076050125825900e736c501f859c50fE728c"
    trusted_send_lib: "0x9d7e4c5321c4c7e8b4e8b4e8b4e8b4e8b4e8b4e8b"
    trusted_receive_lib: "0x9d7e4c5321c4c7e8b4e8b4e8b4e8b4e8b4e8b4e8b"
    private_key: "0xabcdef1234567890abcdef1234567890abcdef1234567890abcdef1234567890"
    eid: 30109
    dvnAddresses:
      - "0x1111111111111111111111111111111111111111"  # LayerZero DVN
      - "0x2222222222222222222222222222222222222222"  # Chainlink DVN

connections:
  - from: "ethereum"
    to: "polygon"
  - from: "polygon"
    to: "ethereum"


